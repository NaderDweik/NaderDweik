<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" width="420" height="150" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:14px;white-space:pre}
.m{fill:#6e7681} .v{fill:#c9d1d9} .h{fill:#58a6ff;font-weight:700}
.k{fill:#ffa657} .g{fill:#3fb950} .p{fill:#ff7b72} .w{fill:#f0f6fc;font-weight:700}
.l{animation:in .35s ease-out both}
@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
 .s{font-size:12px} .big{font-size:18px;font-weight:700}</style>
<rect x=".5" y=".5" width="419" height="149" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="22" y="36"><tspan class="g">~/</tspan><tspan class="h">giving-spirit</tspan></text>
<rect x="324" y="18" width="74" height="22" rx="11" fill="none" stroke="#30363d"/>
<circle cx="338" cy="29" r="4" fill="#3fb950" class="dot"/>
<text x="348" y="33" class="g s">live</text>
<text x="22" y="80" class="w big">giving-estate.com<tspan class="g"> ↗</tspan></text>
<line x1="22" y1="104" x2="398" y2="104" stroke="#30363d" stroke-dasharray="3 4"/>
<text x="22" y="132" class="m s"><tspan class="k">recent</tspan>  ·  shipped to production</text>
</svg>