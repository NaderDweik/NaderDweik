<text x="36" y="120" class="l" style="animation-delay:0.12s" xml:space="preserve"><tspan class="m">NADERDWEIK(1)</tspan><tspan class="m">                 User Commands                 </tspan><tspan class="m">NADERDWEIK(1)</tspan></text>
<text x="36" y="162" class="l" style="animation-delay:0.24s" xml:space="preserve"><tspan class="h">NAME</tspan></text>
<text x="36" y="183" class="l" style="animation-delay:0.30s" xml:space="preserve"><tspan class="v">       </tspan><tspan class="w">naderdweik</tspan><tspan class="v"> - full stack developer, built and maintained in Jordan</tspan></text>
<text x="36" y="225" class="l" style="animation-delay:0.42s" xml:space="preserve"><tspan class="h">SYNOPSIS</tspan></text>
<text x="36" y="246" class="l" style="animation-delay:0.48s" xml:space="preserve"><tspan class="v">       </tspan><tspan class="w">naderdweik </tspan><tspan class="k">[--react] [--node] [--express] [--mongodb] </tspan><tspan class="g">&lt;idea&gt;</tspan></text>
<text x="36" y="288" class="l" style="animation-delay:0.60s" xml:space="preserve"><tspan class="h">DESCRIPTION</tspan></text>
<text x="36" y="309" class="l" style="animation-delay:0.66s" xml:space="preserve"><tspan class="v">       Takes an idea and turns it into a working MERN app, from the</tspan></text>
<text x="36" y="330" class="l" style="animation-delay:0.72s" xml:space="preserve"><tspan class="v">       browser down to the database. Learning in public. Shipping one</tspan></text>
<text x="36" y="351" class="l" style="animation-delay:0.78s" xml:space="preserve"><tspan class="v">       commit at a time.</tspan></text>
<text x="36" y="393" class="l" style="animation-delay:0.90s" xml:space="preserve"><tspan class="h">OPTIONS</tspan></text>
<text x="36" y="414" class="l" style="animation-delay:0.96s" xml:space="preserve"><tspan class="v">       </tspan><tspan class="k">--frontend   </tspan><tspan class="v">html  css  javascript  typescript  react  tailwind</tspan></text>
<text x="36" y="435" class="l" style="animation-delay:1.02s" xml:space="preserve"><tspan class="v">       </tspan><tspan class="k">--backend    </tspan><tspan class="v">node.js  express</tspan></text>
<text x="36" y="456" class="l" style="animation-delay:1.08s" xml:space="preserve"><tspan class="v">       </tspan><tspan class="k">--database   </tspan><tspan class="v">mongodb</tspan></text>
<text x="36" y="477" class="l" style="animation-delay:1.14s" xml:space="preserve"><tspan class="v">       </tspan><tspan class="k">--tools      </tspan><tspan class="v">git  github  vscode  postman  npm</tspan></text>
<text x="36" y="519" class="l" style="animation-delay:1.26s" xml:space="preserve"><tspan class="h">STATUS</tspan></text>
<text x="36" y="540" class="l" style="animation-delay:1.32s" xml:space="preserve"><tspan class="v">       </tspan><tspan class="k">building     </tspan><tspan class="g">cloud-drive-application</tspan></text>
<text x="36" y="561" class="l" style="animation-delay:1.38s" xml:space="preserve"><tspan class="v">       </tspan><tspan class="k">learning     </tspan><tspan class="v">react, node.js, express</tspan></text>
<text x="36" y="582" class="l" style="animation-delay:1.44s" xml:space="preserve"><tspan class="v">       </tspan><tspan class="k">2026         </tspan><tspan class="v">ship 3 production-ready full stack projects</tspan></text>
<text x="36" y="624" class="l" style="animation-delay:1.56s" xml:space="preserve"><tspan class="h">DIAGNOSTICS</tspan></text>
<text x="36" y="645" class="l" style="animation-delay:1.62s" xml:space="preserve"><tspan class="v">       When something breaks, explains the bug out loud until it</tspan></text>
<text x="36" y="666" class="l" style="animation-delay:1.68s" xml:space="preserve"><tspan class="v">       confesses. Works more often than it should.</tspan></text>
<text x="36" y="708" class="l" style="animation-delay:1.80s" xml:space="preserve"><tspan class="h">BUGS</tspan></text>
<text x="36" y="729" class="l" style="animation-delay:1.86s" xml:space="preserve"><tspan class="v">       Will ask what you're building. Will have opinions about it.</tspan></text>
<text x="36" y="771" class="l" style="animation-delay:1.98s" xml:space="preserve"><tspan class="h">SEE ALSO</tspan></text>
